# Margin for Android (.apk) and Windows (.zip with Margin.exe), built from android-windows/.
# The iOS build (build-ios.yml) is separate and unaffected.
name: Build Android and Windows

on:
  workflow_dispatch:
  push:
    branches: ['flutter-*']

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: android-windows
    shell: bash

jobs:
  test:
    name: Tests (app and sync server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connector and sync server tests
        working-directory: .
        run: node connector/test.mjs

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Android project
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Name the APK
        env:
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Margin-android-${{ github.run_number }}.apk"
          if [[ "$SIGNED" != "true" ]]; then
            echo "::warning::APK is signed with a temporary debug key. Updating needs an uninstall first (see README)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Margin-android-${{ github.run_number }}
          path: android-windows/dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Windows project
        run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Zip the app folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/Margin-windows-${{ github.run_number }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Margin-windows-${{ github.run_number }}
          path: android-windows/dist/*.zip
          if-no-files-found: error
