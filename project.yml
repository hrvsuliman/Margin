# XcodeGen project definition.
# The .xcodeproj is NOT stored in Git. GitHub Actions runs `xcodegen generate`
# on a Mac and creates Margin.xcodeproj from this file before every build.
# Docs: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: Margin

options:
  bundleIdPrefix: com.hrvsuliman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Bump MARKETING_VERSION when a phase ships. CI overrides
    # CURRENT_PROJECT_VERSION with the GitHub Actions run number.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 6 compiler, Swift 5 language mode (avoids strict-concurrency errors).
    SWIFT_VERSION: "5.0"

targets:
  Margin:
    type: application
    platform: iOS
    sources: [Margin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrvsuliman.margin
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Margin
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - MarginTests

  MarginTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MarginTests]
    dependencies:
      - target: Margin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrvsuliman.margin.tests
        GENERATE_INFOPLIST_FILE: YES
        # Run the tests inside the app so `@testable import Margin` works.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Margin.app/Margin"
        BUNDLE_LOADER: "$(TEST_HOST)"
