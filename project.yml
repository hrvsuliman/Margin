# XcodeGen project definition.
# The .xcodeproj is NOT stored in Git. GitHub Actions runs `xcodegen generate`
# on a Mac and creates Margin.xcodeproj from this file before every build.
# Docs: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: Margin

options:
  bundleIdPrefix: com.hrvsuliman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    # Bump MARKETING_VERSION when a phase ships. CI overrides
    # CURRENT_PROJECT_VERSION with the GitHub Actions run number.
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 6 compiler, Swift 5 language mode (avoids strict-concurrency errors).
    SWIFT_VERSION: "5.0"

targets:
  Margin:
    type: application
    platform: iOS
    sources: [Margin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrvsuliman.margin
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Extra keys (document types, background modes) merged into the generated plist.
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Margin
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Für Aufnahmen von Unterrichtsstunden, die Margin auf dem iPhone in Text umwandelt."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Damit Margin deine Aufnahmen auf dem iPhone in Text umwandeln kann."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Damit Claude auf deinem PC (Claude Code oder Claude Desktop) im selben WLAN auf Margin zugreifen kann – nur wenn du „Claude verbinden“ einschaltest."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Damit Margin Prüfungen, Aufgaben und Lerneinheiten in einen eigenen Kalender „Margin“ einträgt. Andere Kalender liest oder ändert Margin nicht."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Damit Margin Prüfungen, Aufgaben und Lerneinheiten in einen eigenen Kalender „Margin“ einträgt."
        INFOPLIST_KEY_NSCameraUsageDescription: "Margin nutzt die Kamera für Fotos von Tafel, Arbeitsblättern und deiner Handschrift-Vorlage. Die Bilder bleiben auf dem iPhone."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Damit du Seiten deiner Notizen als Bilder in Fotos sichern kannst."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - MarginTests

  MarginTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MarginTests]
    dependencies:
      - target: Margin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrvsuliman.margin.tests
        GENERATE_INFOPLIST_FILE: YES
        # Run the tests inside the app so `@testable import Margin` works.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Margin.app/Margin"
        BUNDLE_LOADER: "$(TEST_HOST)"
